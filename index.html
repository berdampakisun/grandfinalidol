  .wrap{max-width:560px;margin:0 auto;padding:22px 14px 50px;}
  .hidden{display:none !important;}

  header{text-align:center;margin-bottom:14px;}
  .kicker{margin:0;font-size:12px;letter-spacing:.14em;color:var(--accent-soft);}
  h1{margin:4px 0 0;font-size:24px;letter-spacing:.02em;}

  .banner{
    text-align:center;font-size:13px;font-weight:600;padding:10px 12px;border-radius:12px;
    margin:0 0 20px;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  }
  .banner.open{color:#0b2a1a;background:var(--green);border-color:var(--green);}

  h2{font-size:15px;margin:22px 0 10px;color:var(--accent-soft);letter-spacing:.06em;text-transform:uppercase;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .cand{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;text-align:center;
  }
  .photo{
    position:relative;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(160deg,#12306a,#081a44);
    font-size:30px;font-weight:800;color:var(--accent-soft);
  }
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .meta{padding:8px 6px 0;}
  .nm{font-size:13px;font-weight:700;line-height:1.2;min-height:32px;display:flex;align-items:center;justify-content:center;}
  .kl{font-size:11px;color:var(--dim);margin-top:2px;}
  .vote{
    margin:8px 8px 4px;padding:12px 0;border:none;border-radius:10px;cursor:pointer;
    background:var(--accent);color:var(--ink);font-size:15px;font-weight:800;letter-spacing:.04em;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    transition:transform .06s;
  }
  .vote:active:not(:disabled){transform:scale(.93);}
  .vote:disabled{opacity:.4;cursor:default;}
  .mine{font-size:11px;color:var(--dim);margin-bottom:9px;min-height:14px;}
  .plus{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);
    pointer-events:none;animation:up .7s ease-out forwards;
  }
  @keyframes up{to{transform:translate(-50%,-70px);opacity:0;}}

  .link{
    display:block;margin:34px auto 0;background:none;border:none;color:var(--dim);
    font-size:12px;cursor:pointer;
  }

  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:340px;margin:40px auto 0;text-align:center;}
  .box input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0a1638;color:var(--text);font-size:15px;margin:10px 0;}
  .btn{padding:11px 16px;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;background:var(--accent);color:var(--ink);}
  .btn.full{width:100%;}
  .btn.green{background:var(--green);color:#04220f;}
  .btn.red{background:var(--red);color:#2a0808;}
  .btn.warn{background:transparent;border:1px solid var(--red);color:var(--red);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);}
  .btn:disabled{opacity:.45;cursor:default;}
  .err{color:var(--red);font-size:13px;margin:6px 0 0;min-height:16px;}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:6px;}
  .pill{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--red);}
  .dot.on{background:var(--green);}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
  .row .lb{width:120px;flex-shrink:0;}
  .track{flex:1;height:24px;background:#0a1638;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .fill{height:100%;background:var(--accent);transition:width .4s;}
  .row.lead .fill{background:var(--green);}
  .row .ct{width:64px;text-align:right;font-variant-numeric:tabular-nums;}
  .tot{font-size:11px;color:var(--dim);margin:2px 0 0;}
  .tools{display:flex;gap:8px;justify-content:center;margin-top:22px;flex-wrap:wrap;}
</style>
</head>

    <div class="banner" id="banner">Memeriksa status voting…</div>

  <!-- ===== Login panitia ===== -->

      <button class="btn full" id="loginBtn" type="button">Masuk</button>

  <div id="vPanel" class="hidden">

    <div class="bar">
      <div class="pill"><span class="dot" id="pDot"></span><span id="pLabel">Memuat…</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn green" id="openBtn" type="button">Buka Vote</button>
        <button class="btn red" id="closeBtn" type="button">Tutup Vote</button>
        <button class="btn warn" id="resetBtn" type="button">Reset Vote</button>
      </div>
    </div>
    <p class="err" id="pMsg"></p>
    <div id="results"></div>
    <div class="tools">

hCzgenBNanKQ9qflRAqRWgVCAhWH//Z"
};

const GROUPS = [
  { id: "putra", judul: "Finalis Putra", kandidat: [
    { id: "X-3",    nama: "Nurul Ahmad",          kelas: "X-3",    foto: FOTO["X-3"] },
    { id: "XI-11",  nama: "M. Ibrahim Aliudin",   kelas: "XI-11",  foto: FOTO["XI-11"] },
    { id: "XII-10", nama: "M. Rayhan Ardiansyah", kelas: "XII-10", foto: FOTO["XII-10"] },
  ]},
  { id: "putri", judul: "Finalis Putri", kandidat: [
    { id: "X-10",   nama: "A'la Kurnia",          kelas: "X-10",   foto: FOTO["X-10"] },
    { id: "XI-10",  nama: "Qory Hafizah",         kelas: "XI-10",  foto: FOTO["XI-10"] },
    { id: "XII-6",  nama: "Annisa Baba",          kelas: "XII-6",  foto: FOTO["XII-6"] },
  ]},
];
/* ===================================== */

const $ = id => document.getElementById(id);
let isOpen = false, pending = {}, flushing = false, adminTimer = null;
let mine = {};
try { mine = JSON.parse(localStorage.getItem("gfMine") || "{}"); } catch (e) {}

function initials(n){ return n.replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase(); }

/* ---------- Tampilan peserta ---------- */
function renderGroups(){
  $("groups").innerHTML = GROUPS.map(g => `
    <h2>${g.judul}</h2>
    <div class="grid">
      ${g.kandidat.map(k => `
        <div class="cand" id="c-${k.id}">
          <div class="photo">${initials(k.nama)}<img src="${k.foto}" alt="${k.nama}" onerror="this.remove()"></div>
          <div class="meta"><div class="nm">${k.nama}</div><div class="kl">Kelas ${k.kelas}</div></div>
          <button class="vote" data-id="${k.id}" type="button" disabled>VOTE</button>
          <div class="mine" id="m-${k.id}"></div>
        </div>`).join("")}
    </div>`).join("");
  GROUPS.forEach(g => g.kandidat.forEach(k => showMine(k.id)));
}
function showMine(id){ $("m-"+id).textContent = mine[id] ? "Suaramu: " + mine[id] : ""; }

function setOpen(v){
  isOpen = v;
  const b = $("banner");
  b.classList.toggle("open", v);
  b.textContent = v ? "🟢 Voting dibuka — tap VOTE sebanyak-banyaknya!" : "🔒 Voting belum dibuka";
  document.querySelectorAll(".vote").forEach(btn => btn.disabled = !v);
}

$("groups").addEventListener("click", e => {
  const btn = e.target.closest(".vote");
  if (!btn || !isOpen) return;
  const id = btn.dataset.id;
  pending[id] = (pending[id] || 0) + 1;
  mine[id] = (mine[id] || 0) + 1;
  showMine(id);
  const p = document.createElement("span");
  p.className = "plus"; p.textContent = "+1";
  p.addEventListener("animationend", () => p.remove());
  $("c-"+id).querySelector(".photo").appendChild(p);
});

function mergeBack(snap){ for (const k in snap) pending[k] = (pending[k] || 0) + snap[k]; }

async function flush(){
  if (flushing || !Object.keys(pending).length) return;
  const snap = pending; pending = {}; flushing = true;
  try {
    const res = await fetch(APPS_SCRIPT_URL, { method:"POST", keepalive:true,
      body: JSON.stringify({ action:"vote", votes:snap }) });
    const d = await res.json();
    if (d.status === "closed") setOpen(false);
    else if (d.status === "busy") mergeBack(snap);
  } catch (e) { mergeBack(snap); }
  flushing = false;
  try { localStorage.setItem("gfMine", JSON.stringify(mine)); } catch (e) {}
}
(function loop(){ flush().finally(() => setTimeout(loop, 3000 + Math.random()*2000)); })();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

async function pollStatus(){
  try {
    const r = await fetch(APPS_SCRIPT_URL + "?action=status&t=" + Date.now());
    const d = await r.json();
    setOpen(d.status === "OPEN");
  } catch (e) {}
  setTimeout(pollStatus, 12000 + Math.random()*6000);
}

/* ---------- Panitia ---------- */
function show(v){
  ["vMain","vLogin","vPanel"].forEach(x => $(x).classList.toggle("hidden", x !== v));
  if (v !== "vPanel" && adminTimer){ clearInterval(adminTimer); adminTimer = null; }
}
$("toPanitia").addEventListener("click", () => { $("pw").value = ""; $("loginErr").textContent = ""; show("vLogin"); });
$("loginBack").addEventListener("click", () => show("vMain"));
$("exitBtn").addEventListener("click", () => show("vMain"));

function tryLogin(){
  if ($("pw").value === ADMIN_PASSWORD){
    show("vPanel"); loadTally(); adminTimer = setInterval(loadTally, 5000);
  } else $("loginErr").textContent = "Password salah.";
}
$("loginBtn").addEventListener("click", tryLogin);
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });

async function admin(action, extra){
  $("pMsg").textContent = "";
  try {
    const r = await fetch(APPS_SCRIPT_URL, { method:"POST",
      body: JSON.stringify(Object.assign({ action, password: ADMIN_PASSWORD }, extra || {})) });
    const d = await r.json();
    if (d.status !== "ok") { $("pMsg").style.color = ""; $("pMsg").textContent = "Gagal: " + (d.message || d.status); }
    else if (action === "reset") { $("pMsg").style.color = "var(--green)"; $("pMsg").textContent = "Semua suara sudah direset ke 0."; }
  } catch (e) { $("pMsg").textContent = "Gagal terhubung ke server."; }
  loadTally();
}
$("openBtn").addEventListener("click", () => admin("setStatus", { value:"OPEN" }));
$("closeBtn").addEventListener("click", () => admin("setStatus", { value:"CLOSED" }));
$("resetBtn").addEventListener("click", () => {
  if (confirm("Reset vote? SEMUA suara akan kembali ke 0 dan tidak bisa dibatalkan.")) admin("reset");
});

async function loadTally(){
  try {
    const r = await fetch(APPS_SCRIPT_URL + "?action=tally&t=" + Date.now());
    const d = await r.json();
    const on = d.status === "OPEN";
    $("pDot").classList.toggle("on", on);
    $("pLabel").textContent = on ? "Voting dibuka" : "Voting ditutup";
    $("openBtn").disabled = on; $("closeBtn").disabled = !on;
    $("results").innerHTML = GROUPS.map(g => {
      const nums = g.kandidat.map(k => (d.tally && d.tally[k.id]) || 0);
      const total = nums.reduce((a,b) => a+b, 0), max = Math.max.apply(null, nums);
      return `<h2>${g.judul}</h2>` + g.kandidat.map((k,i) => `
        <div class="row ${max > 0 && nums[i] === max ? "lead" : ""}">
          <div class="lb">${k.nama}</div>
          <div class="track"><div class="fill" style="width:${total ? (nums[i]/total*100).toFixed(1) : 0}%"></div></div>
          <div class="ct">${nums[i].toLocaleString("id-ID")}</div>
        </div>`).join("") + `<p class="tot">Total ${g.judul.toLowerCase()}: ${total.toLocaleString("id-ID")}</p>`;
    }).join("");
  } catch (e) { $("pMsg").textContent = "Gagal memuat hasil. Cek koneksi."; }
}

renderGroups();
setOpen(false);
pollStatus();
</script>
</body>
</html>
